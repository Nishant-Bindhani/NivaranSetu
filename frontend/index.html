<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NivaranSetu</title>
    <style>
      /* Static, JS-free splash shown before React mounts. Matches
         AuthLayout's crimson gradient + bridge logo. #initial-splash is
         removed by main.tsx the instant React actually renders. */
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom right, #900007, #4c0519);
      }
      #initial-splash svg {
        width: 56px;
        height: 56px;
        animation: initial-splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes initial-splash-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 23H28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <path d="M12 6V23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <path d="M20 6V23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
          <path d="M12 6L6 23" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
          <path d="M12 6L16 23" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
          <path d="M20 6L16 23" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
          <path d="M20 6L26 23" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
